{% extends "superadmin_layout.html" %}
{% load static %}
{% block title %}Users - Billing System{% endblock %}

{% block content %}
<div class="inv-mgmt-page">
    <div id="users-list-panel" class="inv-mgmt-page-panel">
        <div class="inv-mgmt-header">
            <h2 class="inv-dashboard-greeting">Users</h2>
        </div>

        <div class="inv-mgmt-card">
            <div class="inv-mgmt-toolbar">
                <input type="search" id="users-search" class="inv-mgmt-search" placeholder="Search by name, email, or mobile..."/>
            </div>
            <div class="inv-mgmt-table-wrap">
                <table class="inv-mgmt-table inv-mgmt-table--users">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Mobile</th>
                            <th>Registered</th>
                            <th>Approved</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th class="inv-mgmt-cell--action">Action</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body">
                        <tr>
                            <td colspan="8" class="inv-mgmt-empty">Loading users...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div id="users-pagination" class="inv-pagination"></div>
        </div>
    </div>

    <div id="users-view-panel" class="inv-mgmt-page-panel inv-hidden">
        <div class="inv-mgmt-panel-header">
            <h2 id="user-detail-title" class="inv-dashboard-greeting">User Details</h2>
            <button type="button" class="inv-mgmt-btn inv-page-back-btn" data-page-back="users-list-panel">
                <span class="material-symbols-outlined">arrow_back</span>
                Back to List
            </button>
        </div>
        <div class="inv-mgmt-card inv-mgmt-panel-card">
            <div class="inv-mgmt-panel-body">
                <div id="user-detail-body" class="inv-product-view-grid"></div>
                <div id="user-detail-businesses-wrap" class="inv-user-detail-businesses"></div>
            </div>
            <div class="inv-mgmt-panel-footer">
                <button type="button" class="inv-mgmt-btn inv-mgmt-btn--primary" data-page-back="users-list-panel">Close</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block page_scripts %}
<link href="{% static 'css/users.css' %}" rel="stylesheet"/>
<script src="{% static 'js/inventory-api.js' %}"></script>
<script src="{% static 'js/inventory-page-panel.js' %}"></script>
<script src="{% static 'js/inventory-users.js' %}"></script>
<script>
InventoryPagePanel.init();
InventoryUsers.init();
</script>
{% endblock %}
