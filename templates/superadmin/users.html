{% extends "superadmin_layout.html" %}
{% load static %}
{% block title %}Users - Billing System{% endblock %}

{% block content %}
<div class="inv-users-page">
    <div class="inv-users-header">
        <h2 class="inv-dashboard-greeting">Users</h2>
    </div>

    <div class="inv-users-card">
        <div class="inv-users-toolbar">
            <input type="search" id="users-search" class="inv-users-search" placeholder="Search by name, email, or mobile..."/>
        </div>
        <div class="inv-users-table-wrap">
            <table class="inv-users-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Mobile</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="users-table-body">
                    <tr>
                        <td colspan="6" class="inv-users-empty">Loading users...</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div id="users-pagination" class="inv-pagination"></div>
    </div>
</div>
{% endblock %}

{% block page_scripts %}
<link href="{% static 'css/users.css' %}" rel="stylesheet"/>
<script src="{% static 'js/inventory-api.js' %}"></script>
<script src="{% static 'js/inventory-users.js' %}"></script>
<script>InventoryUsers.init();</script>
{% endblock %}
