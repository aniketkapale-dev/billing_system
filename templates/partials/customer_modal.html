<div id="customer-modal" class="inv-modal inv-hidden" aria-hidden="true">
    <div class="inv-modal-backdrop" data-modal-close></div>
    <div class="inv-modal-dialog inv-modal-dialog--wide" role="dialog" aria-modal="true" aria-labelledby="customer-modal-title">
        <div class="inv-modal-header">
            <h3 id="customer-modal-title">Add Customer</h3>
            <button type="button" class="inv-modal-close" data-modal-close aria-label="Close">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <div class="inv-modal-body">
            {% include "partials/customer_form_fields.html" %}
        </div>
        <div class="inv-modal-footer">
            <button type="button" class="inv-mgmt-btn" data-modal-close>Cancel</button>
            <button id="customer-save-btn" type="button" class="inv-mgmt-btn inv-mgmt-btn--primary">Save Customer</button>
        </div>
    </div>
</div>
