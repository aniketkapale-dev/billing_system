    <div id="category-tax-apply-modal" class="inv-modal inv-hidden" aria-hidden="true">

                            </div>
                            <button id="category-tax-add-category-btn" type="button" class="inv-category-tax-add-btn">
                                <span class="material-symbols-outlined" aria-hidden="true">add</span>
                                Add
                            </button>
                        </header>
                        <div id="category-tax-new-panel" class="inv-category-tax-inline-form inv-hidden">

                                <input type="checkbox" id="category-tax-modal-select-all-categories"/>

                            </label>
                        </div>
                        <div id="category-tax-modal-categories" class="inv-category-tax-check-list">
                            <p class="inv-mgmt-empty">Loading categories...</p>
                        </div>
                    </section>
                    <section class="inv-category-tax-panel">
                        <header class="inv-category-tax-panel-header">
                            <div class="inv-category-tax-panel-title">
                                <span class="material-symbols-outlined" aria-hidden="true">percent</span>
                                <h4>Taxes</h4>
                                <span id="category-tax-tax-count" class="inv-category-tax-count"></span>
                            </div>
                            <button id="category-tax-add-tax-btn" type="button" class="inv-category-tax-add-btn">
                                <span class="material-symbols-outlined" aria-hidden="true">add</span>
                                Add
                            </button>
                        </header>
                        <div id="category-tax-new-tax-panel" class="inv-category-tax-inline-form inv-category-tax-inline-form--tax inv-hidden">
                            <input id="category-tax-new-key" class="inv-mgmt-input" type="text" placeholder="Tax key (e.g. gst12%)"/>
                            <input id="category-tax-new-value" class="inv-mgmt-input" type="number" min="0" max="100" step="0.01" placeholder="Value %"/>
                            <div class="inv-category-tax-inline-form-actions">
                                <button id="category-tax-save-tax-btn" type="button" class="inv-mgmt-btn inv-mgmt-btn--primary inv-mgmt-btn--sm">Save</button>
                                <button id="category-tax-cancel-tax-btn" type="button" class="inv-mgmt-btn inv-mgmt-btn--sm">Cancel</button>
                            </div>
                        </div>
                        <div class="inv-category-tax-toolbar">
                            <input id="category-tax-modal-tax-search" class="inv-mgmt-input" type="search" placeholder="Search taxes..."/>
                        </div>
                        <div id="category-tax-modal-taxes" class="inv-category-tax-check-list">
                            <p class="inv-mgmt-empty">Loading taxes...</p>
                        </div>
                    </section>
                </div>
            </div>
            <div class="inv-modal-footer">
                <button type="button" class="inv-mgmt-btn" data-modal-close>Cancel</button>
                <button id="category-tax-modal-apply-btn" type="button" class="inv-mgmt-btn inv-mgmt-btn--primary">Apply Tax</button>
            </div>
        </div>
    </div>
