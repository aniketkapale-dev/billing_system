<header class="topbar">
    <button class="btn topbar-burger" id="sidebar-toggle" type="button">
        <i class="bi bi-list"></i>
    </button>
    <h1 class="topbar-title">{% block page_title %}{% endblock %}</h1>

    <div class="topbar-right">
        <div class="dropdown profile-dropdown">
            <button class="profile-trigger" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                <span class="avatar"><i class="bi bi-person-fill"></i></span>
                <span class="profile-meta">
                    <span class="profile-name" id="current-user-name">—</span>
                    <span class="profile-role" id="current-user-email"></span>
                </span>
                <i class="bi bi-chevron-down ms-1"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end profile-menu">
                <li class="dropdown-header" id="current-user-header">Signed in</li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <a class="dropdown-item" href="#" id="logout-btn-top">
                        <i class="bi bi-box-arrow-right me-2"></i>Logout
                    </a>
                </li>
            </ul>
        </div>
    </div>
</header>
