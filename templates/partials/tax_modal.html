<div id="tax-modal" class="inv-modal inv-hidden" aria-hidden="true">
    <div class="inv-modal-backdrop" data-modal-close></div>
    <div class="inv-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="tax-modal-title">
        <div class="inv-modal-header">
            <h3 id="tax-modal-title">Add Tax</h3>
            <button type="button" class="inv-modal-close" data-modal-close aria-label="Close">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <div class="inv-modal-body">
            <div class="inv-mgmt-form-grid" style="padding:0;">
                <div class="inv-mgmt-field">
                    <label for="settings-tax-key">Key</label>
                    <input id="settings-tax-key" class="inv-mgmt-input" type="text" placeholder="e.g. gst12%" required/>
                </div>
                <div class="inv-mgmt-field">
                    <label for="settings-tax-value">Value (%)</label>
                    <input id="settings-tax-value" class="inv-mgmt-input" type="number" min="0" max="100" step="0.01" placeholder="e.g. 12" required/>
                </div>
            </div>
        </div>
        <div class="inv-modal-footer">
            <button type="button" class="inv-mgmt-btn" data-modal-close>Cancel</button>
            <button id="settings-tax-save-btn" type="button" class="inv-mgmt-btn inv-mgmt-btn--primary">Save Tax</button>
        </div>
    </div>
</div>
