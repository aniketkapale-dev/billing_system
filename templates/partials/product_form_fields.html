<div id="product-form-rows" class="inv-product-form-rows">
<div class="inv-product-form-row" data-row-index="0">
<div class="inv-mgmt-form-grid inv-mgmt-form-grid--product" style="padding:0;">
    <div class="inv-mgmt-field">
        <label for="product-name">Product Name</label>
        <input id="product-name" class="inv-mgmt-input inv-product-field-name" type="text" placeholder="Product name" required/>
    </div>
    <div class="inv-mgmt-field">
        <label for="product-sku">SKU <span class="inv-field-required"></span></label>
        <input id="product-sku" class="inv-mgmt-input inv-product-field-sku" type="text" maxlength="50" placeholder="Auto-generated, editable" required/>
    </div>
    <div class="inv-mgmt-field">
        <label for="product-category">Category</label>
        <div class="inv-field-inline">
            <select id="product-category" class="inv-mgmt-select inv-product-field-category" required>
                <option value="">Select category</option>
            </select>
            <button id="product-category-add-btn" type="button" class="inv-inline-add-btn" title="Add new category" aria-label="Add new category">
                <span class="material-symbols-outlined">add</span>
            </button>
        </div>
        <div id="product-category-new-panel" class="inv-inline-add-panel inv-hidden">
            <input id="product-category-new-name" class="inv-mgmt-input" type="text" placeholder="New category name"/>
            <input id="product-category-new-desc" class="inv-mgmt-input" type="text" placeholder="Description (optional)"/>
            <div class="inv-inline-add-actions">
                <button id="product-category-save-btn" type="button" class="inv-mgmt-btn inv-mgmt-btn--primary">Save Category</button>
                <button id="product-category-cancel-btn" type="button" class="inv-mgmt-btn">Cancel</button>
            </div>
        </div>
    </div>
    <div class="inv-mgmt-field">
        <label for="product-brand">Brand</label>
        <div class="inv-field-inline">
            <select id="product-brand" class="inv-mgmt-select inv-product-field-brand">
                <option value="">Select brand (optional)</option>
            </select>
            <button id="product-brand-add-btn" type="button" class="inv-inline-add-btn" title="Add new brand" aria-label="Add new brand">
                <span class="material-symbols-outlined">add</span>
            </button>
        </div>
        <div id="product-brand-new-panel" class="inv-inline-add-panel inv-hidden">
            <input id="product-brand-new-name" class="inv-mgmt-input" type="text" placeholder="New brand name"/>
            <div class="inv-inline-add-actions">
                <button id="product-brand-save-btn" type="button" class="inv-mgmt-btn inv-mgmt-btn--primary">Save Brand</button>
                <button id="product-brand-cancel-btn" type="button" class="inv-mgmt-btn">Cancel</button>
            </div>
        </div>
    </div>
    <div class="inv-mgmt-field">
        <label for="product-manufacturer">Manufacturer</label>
        <div class="inv-field-inline">
            <select id="product-manufacturer" class="inv-mgmt-select inv-product-field-manufacturer">
                <option value="">Select manufacturer (optional)</option>
            </select>
            <button id="product-manufacturer-add-btn" type="button" class="inv-inline-add-btn" title="Add new manufacturer" aria-label="Add new manufacturer">
                <span class="material-symbols-outlined">add</span>
            </button>
        </div>
        <div id="product-manufacturer-new-panel" class="inv-inline-add-panel inv-hidden">
            <input id="product-manufacturer-new-name" class="inv-mgmt-input" type="text" placeholder="New manufacturer name"/>
            <div class="inv-inline-add-actions">
                <button id="product-manufacturer-save-btn" type="button" class="inv-mgmt-btn inv-mgmt-btn--primary">Save Manufacturer</button>
                <button id="product-manufacturer-cancel-btn" type="button" class="inv-mgmt-btn">Cancel</button>
            </div>
        </div>
    </div>
    <div class="inv-mgmt-field">
        <label for="product-unit">Unit</label>
        <div class="inv-field-inline">
            <select id="product-unit" class="inv-mgmt-select inv-product-field-unit" required>
                <option value="">Select unit</option>
            </select>
            <button id="product-unit-add-btn" type="button" class="inv-inline-add-btn" title="Add new unit" aria-label="Add new unit">
                <span class="material-symbols-outlined">add</span>
            </button>
        </div>
        <div id="product-unit-new-panel" class="inv-inline-add-panel inv-hidden">
            <input id="product-unit-new-name" class="inv-mgmt-input" type="text" placeholder="Unit name (e.g. Piece)"/>
            <input id="product-unit-new-short" class="inv-mgmt-input" type="text" placeholder="Short name (e.g. pcs)"/>
            <div class="inv-inline-add-actions">
                <button id="product-unit-save-btn" type="button" class="inv-mgmt-btn inv-mgmt-btn--primary">Save Unit</button>
                <button id="product-unit-cancel-btn" type="button" class="inv-mgmt-btn">Cancel</button>
            </div>
        </div>
    </div>

    <div class="inv-mgmt-field">
        <label for="product-quantity">Opening Stock</label>
        <input id="product-quantity" class="inv-mgmt-input inv-product-field-quantity" type="number" min="0" step="0.01" placeholder="Optional"/>
    </div>

    <div class="inv-mgmt-field">
        <label for="product-price-with-tax">Cost Price with Tax (per product)</label>
        <input id="product-price-with-tax" class="inv-mgmt-input inv-product-field-price" type="number" min="0" step="0.01" placeholder="0.00"/>
    </div>
    <div class="inv-mgmt-field" id="product-mrp-field">
        <label for="product-mrp">MRP <span class="inv-field-optional">(optional)</span></label>
        <input id="product-mrp" class="inv-mgmt-input inv-product-field-mrp" type="number" min="0" step="0.01" placeholder="0.00"/>
        <div id="product-mrp-hint" class="inv-field-hint inv-hidden" aria-live="polite"></div>
    </div>

    <div class="inv-mgmt-field inv-mgmt-field--full">
        <label for="product-description">Description (Optional)</label>
        <textarea id="product-description" class="inv-mgmt-textarea inv-product-field-description" rows="3" placeholder="Optional description"></textarea>
    </div>
</div>
</div>
