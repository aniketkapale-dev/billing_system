<div class="inv-mgmt-form-grid inv-mgmt-form-grid--sale-top" style="padding:0;">
    <div class="inv-mgmt-field">
        <label for="customer-name">Full Name</label>
        <input id="customer-name" class="inv-mgmt-input" type="text" placeholder="Customer full name" required/>
    </div>
    <div class="inv-mgmt-field">
        <label for="customer-mobile">Mobile Number</label>
        <input id="customer-mobile" class="inv-mgmt-input" type="text" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number" required/>
    </div>
    <div class="inv-mgmt-field">
        <label for="customer-email">Email <span class="inv-field-optional">(optional)</span></label>
        <input id="customer-email" class="inv-mgmt-input" type="email" placeholder="Email address"/>
    </div>
</div>
<div class="inv-mgmt-form-grid" style="padding:0;margin-top:16px;">
    <div class="inv-mgmt-field inv-mgmt-field--full">
        <label for="customer-address">Address <span class="inv-field-optional">(optional)</span></label>
        <textarea id="customer-address" class="inv-mgmt-textarea" rows="3" placeholder="Customer address"></textarea>
    </div>
</div>
