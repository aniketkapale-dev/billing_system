<div id="customer-form-rows" class="inv-product-form-rows">
<div class="inv-customer-form-row inv-product-form-row" data-row-index="0">
<div class="inv-mgmt-form-grid inv-mgmt-form-grid--sale-top" style="padding:0;">
    <div class="inv-mgmt-field">
        <label for="customer-name">Full Name <span class="inv-field-required"></span></label>
        <input id="customer-name" class="inv-mgmt-input inv-customer-field-name" type="text" placeholder="Customer full name" required/>
    </div>
    <div class="inv-mgmt-field">
        <label for="customer-mobile">Mobile Number <span class="inv-field-required"></span></label>
        <input id="customer-mobile" class="inv-mgmt-input inv-customer-field-mobile" type="text" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number" required/>
    </div>
    <div class="inv-mgmt-field">
        <label for="customer-email">Email <span class="inv-field-optional">(optional)</span></label>
        <input id="customer-email" class="inv-mgmt-input inv-customer-field-email" type="email" placeholder="Email address"/>
    </div>
    <div class="inv-mgmt-field">
        <label for="customer-pin-code">Pin Code <span class="inv-field-required"></span></label>
        <input id="customer-pin-code" class="inv-mgmt-input inv-customer-field-pin-code" type="text" inputmode="numeric" maxlength="6" placeholder="6-digit pin code" required/>
    </div>
</div>
<div class="inv-mgmt-form-grid" style="padding:0;margin-top:16px;">
    <div class="inv-mgmt-field inv-mgmt-field--full">
        <label for="customer-address">Address <span class="inv-field-required"></span></label>
        <textarea id="customer-address" class="inv-mgmt-textarea inv-customer-field-address" rows="3" placeholder="Customer address" required></textarea>
    </div>
</div>

<div class="inv-customer-business-toggle" style="margin-top:20px;">
    <label class="inv-mgmt-checkbox-label">
        <input class="inv-customer-field-add-business" id="customer-add-business" type="checkbox"/>
        <span>Add company</span>
    </label>
</div>

<div class="inv-customer-business-fields inv-customer-field-business-panel inv-hidden" id="customer-business-fields" style="margin-top:16px;">
    <div class="inv-mgmt-form-grid inv-mgmt-form-grid--sale-top" style="padding:0;">
        <div class="inv-mgmt-field">
            <label for="customer-company-name">Company Name</label>
            <input id="customer-company-name" class="inv-mgmt-input inv-customer-field-company-name" type="text" placeholder="Company name"/>
        </div>
        <div class="inv-mgmt-field">
            <label for="customer-company-mobile">Company Mobile <span class="inv-field-optional">(optional)</span></label>
            <input id="customer-company-mobile" class="inv-mgmt-input inv-customer-field-company-mobile" type="text" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number"/>
        </div>
    </div>
    <div class="inv-mgmt-form-grid inv-mgmt-form-grid--sale-top" style="padding:0;margin-top:16px;">
        <div class="inv-mgmt-field">
            <label for="customer-gst">GST No <span class="inv-field-optional">(optional)</span></label>
            <input id="customer-gst" class="inv-mgmt-input inv-customer-field-gst" type="text" placeholder="GST number" maxlength="30"/>
        </div>
    </div>
    <div class="inv-mgmt-form-grid" style="padding:0;margin-top:16px;">
        <div class="inv-mgmt-field inv-mgmt-field--full">
            <label for="customer-business-address">Company Address <span class="inv-field-optional">(optional)</span></label>
            <textarea id="customer-business-address" class="inv-mgmt-textarea inv-customer-field-business-address" rows="3" placeholder="Company address"></textarea>
        </div>
    </div>
    <div class="inv-mgmt-form-grid" style="padding:0;margin-top:16px;">
        <div class="inv-mgmt-field inv-mgmt-field--full">
            <label for="customer-shipping-address">Shipping Address <span class="inv-field-optional">(optional)</span></label>
            <textarea id="customer-shipping-address" class="inv-mgmt-textarea inv-customer-field-shipping-address" rows="3" placeholder="Shipping address"></textarea>
        </div>
    </div>
</div>
</div>
</div>
