{% extends "user_layout.html" %}
{% load static %}
{% block title %}Products - Billing System{% endblock %}

{% block content %}
<div class="inv-mgmt-page">
    <div id="products-list-panel" class="inv-mgmt-page-panel">
        <div class="inv-mgmt-header">
            <h2 class="inv-dashboard-greeting">Products</h2>
            <button id="product-open-modal-btn" type="button" class="inv-mgmt-btn inv-mgmt-btn--primary">
                <span class="material-symbols-outlined">add</span>
                Add Product
            </button>
        </div>

        <div class="inv-mgmt-card">
            <div class="inv-mgmt-toolbar inv-mgmt-toolbar--filters">
                <input type="search" id="products-search" class="inv-mgmt-search" placeholder="Search products..."/>
                <select id="products-category-filter" class="inv-mgmt-select inv-mgmt-filter-select" aria-label="Category">
                    <option value="">All categories</option>
                </select>
                <select id="products-unit-filter" class="inv-mgmt-select inv-mgmt-filter-select" aria-label="Unit">
                    <option value="">All units</option>
                </select>
                <button type="button" id="products-clear-filters" class="inv-mgmt-btn">Clear</button>
            </div>

            <div class="inv-mgmt-table-wrap">
                <table class="inv-mgmt-table inv-mgmt-table--products">
                    <thead>
                        <tr></tr>
                    </thead>
                    <tbody id="products-table-body">
                        <tr><td colspan="11" class="inv-mgmt-empty">Loading products...</td></tr>
                    </tbody>
                </table>
            </div>
            <div id="products-pagination" class="inv-pagination"></div>
        </div>
    </div>

    <div id="products-form-panel" class="inv-mgmt-page-panel inv-hidden">
        <div class="inv-mgmt-panel-header">
            <h2 id="product-form-title" class="inv-dashboard-greeting">Add Product</h2>
            <button type="button" class="inv-mgmt-btn inv-page-back-btn" data-page-back="products-list-panel">
                <span class="material-symbols-outlined">arrow_back</span>
                Back to List
            </button>
        </div>
        <div class="inv-mgmt-card inv-mgmt-panel-card">
            <div class="inv-mgmt-panel-body">
                {% include "partials/product_form_fields.html" %}
            </div>
            <div class="inv-mgmt-panel-footer">
                <button type="button" class="inv-mgmt-btn" data-page-back="products-list-panel">Cancel</button>
                <button id="product-save-btn" type="button" class="inv-mgmt-btn inv-mgmt-btn--primary">Save Product</button>
            </div>
        </div>
    </div>

    <div id="products-view-panel" class="inv-mgmt-page-panel inv-detail-view-panel inv-hidden">
        <div class="inv-mgmt-panel-header inv-detail-view-header">
            <h2 id="product-view-title" class="inv-dashboard-greeting inv-detail-view-title">Product Details</h2>
            <button type="button" class="inv-mgmt-btn inv-page-back-btn" data-page-back="products-list-panel">
                <span class="material-symbols-outlined">arrow_back</span>
                Back to List
            </button>
        </div>
        <div class="inv-mgmt-card inv-mgmt-panel-card inv-detail-view-card">
            <div class="inv-mgmt-panel-body inv-detail-view-body">
                <div id="product-view-body" class="inv-detail-view-grid inv-product-view-grid"></div>
            </div>
            <div class="inv-mgmt-panel-footer inv-detail-view-footer">
                <button type="button" class="inv-mgmt-btn inv-mgmt-btn--primary" data-page-back="products-list-panel">Close</button>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block page_scripts %}
<script src="{% static 'js/components/modal.js' %}"></script>
<script src="{% static 'js/components/page-panel.js' %}"></script>
<script src="{% static 'js/inventory/products.js' %}?v=20260310-product-no-barcode"></script>
<script>
InventoryPagePanel.init();
InventoryProducts.init();
</script>
{% endblock %}
