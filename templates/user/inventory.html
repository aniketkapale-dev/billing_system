{% extends "user_layout.html" %}
{% load static %}
{% block title %}Stock - Billing System{% endblock %}

{% block content %}
<div class="inv-mgmt-page">
    <div id="inventory-list-panel" class="inv-mgmt-page-panel">
    <div class="inv-mgmt-header">
        <h2 class="inv-dashboard-greeting">Stock</h2>
        <a href="/dashboard/stock-in/" class="inv-mgmt-btn inv-mgmt-btn--primary">
            <span class="material-symbols-outlined">input</span>
            Add Purchase
        </a>
    </div>

    <div class="inv-mgmt-tabs" role="tablist">
        <button type="button" class="inv-mgmt-tab inv-mgmt-tab--active" data-tab="summary" role="tab" aria-selected="true">Current Stock</button>
        <button type="button" class="inv-mgmt-tab" data-tab="batches" role="tab" aria-selected="false">Batch Wise</button>
    </div>

    <div class="inv-mgmt-card" id="inventory-summary-panel">
        <div class="inv-mgmt-toolbar inv-mgmt-toolbar--filters">
            <input type="search" id="inventory-search" class="inv-mgmt-search" placeholder="Search stock..."/>
            <select id="inventory-unit-filter" class="inv-mgmt-select inv-mgmt-filter-select" aria-label="Unit">
                <option value="">All units</option>
            </select>
            <button type="button" id="inventory-clear-filters" class="inv-mgmt-btn">Clear</button>
        </div>
        <div class="inv-mgmt-table-wrap">
            <table class="inv-mgmt-table inv-mgmt-table--inventory">
                <thead>
                    <tr></tr>
                </thead>
                <tbody id="inventory-table-body">
                    <tr><td colspan="5" class="inv-mgmt-empty">Loading inventory...</td></tr>
                </tbody>
            </table>
        </div>
        <div id="inventory-pagination" class="inv-pagination"></div>
    </div>

    <div class="inv-mgmt-card inv-hidden" id="inventory-batches-panel">
        <div class="inv-mgmt-toolbar inv-mgmt-toolbar--filters">
            <input type="search" id="batch-search" class="inv-mgmt-search" placeholder="Search batches..."/>
            <select id="batch-unit-filter" class="inv-mgmt-select inv-mgmt-filter-select" aria-label="Unit">
                <option value="">All units</option>
            </select>
            <label class="inv-mgmt-checkbox-label">
                <input type="checkbox" id="batch-in-stock-only" checked/>
                In stock only
            </label>
            <button type="button" id="batch-clear-filters" class="inv-mgmt-btn">Clear</button>
        </div>
        <div class="inv-mgmt-table-wrap">
            <table class="inv-mgmt-table inv-mgmt-table--batches">
                <thead>
                    <tr></tr>
                </thead>
                <tbody id="batch-table-body">
                    <tr><td colspan="9" class="inv-mgmt-empty">Loading batches...</td></tr>
                </tbody>
            </table>
        </div>
        <div id="batch-pagination" class="inv-pagination"></div>
    </div>
    </div>

    <div id="inventory-view-panel" class="inv-mgmt-page-panel inv-detail-view-panel inv-hidden">
        <div class="inv-mgmt-panel-header inv-detail-view-header">
            <h2 id="inventory-view-title" class="inv-dashboard-greeting inv-detail-view-title">Stock Details</h2>
            <button type="button" class="inv-mgmt-btn inv-page-back-btn" data-page-back="inventory-list-panel">
                <span class="material-symbols-outlined">arrow_back</span>
                Back to List
            </button>
        </div>
        <div class="inv-mgmt-card inv-mgmt-panel-card inv-detail-view-card">
            <div class="inv-mgmt-panel-body inv-detail-view-body">
                <div id="inventory-view-body" class="inv-detail-view-grid inv-product-view-grid"></div>
                <div id="inventory-view-purchases-wrap" class="inv-detail-view-items inv-stockin-view-items"></div>
            </div>
            <div class="inv-mgmt-panel-footer inv-detail-view-footer">
                <button type="button" class="inv-mgmt-btn inv-mgmt-btn--primary" data-page-back="inventory-list-panel">Close</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block page_scripts %}
<script src="{% static 'js/components/page-panel.js' %}"></script>
<script src="{% static 'js/inventory/stock.js' %}?v=20260308-stock-unit-filter"></script>
<script>
InventoryPagePanel.init();
InventoryStock.init();
</script>
{% endblock %}
